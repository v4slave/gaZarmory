name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: armory_aa
          POSTGRES_USER: armory_aa
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armory_aa -d armory_aa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: armory_aa
      DB_USERNAME: armory_aa
      DB_PASSWORD: test-password
      DB_SEARCH_PATH: armory_aa_testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, mbstring, intl, gd, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        working-directory: backend
        run: composer validate --strict

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create testing environment file
        working-directory: backend
        run: cp .env.example .env

      - name: Audit backend dependencies
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Create isolated test schema
        env:
          PGPASSWORD: test-password
        run: >-
          psql
          --host=127.0.0.1
          --username=armory_aa
          --dbname=armory_aa
          --command="CREATE SCHEMA armory_aa_testing AUTHORIZATION armory_aa"

      - name: Verify clean database migration
        working-directory: backend
        run: php artisan migrate --force --no-interaction

      - name: Run backend tests
        working-directory: backend
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend checks
        working-directory: frontend
        run: npm run check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source=/repo --no-banner --redact
          --gitleaks-ignore-path=/repo/.gitleaksignore
