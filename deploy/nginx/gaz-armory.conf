limit_req_zone $binary_remote_addr zone=gaz_armory_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=gaz_armory_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name armory.example.com;

    root /var/www/gaz-armory/current/frontend/dist;
    index index.html;
    # Local uploads are images only, limited to 20 MB by the application.
    client_max_body_size 22m;
    include /etc/nginx/snippets/gaz-armory-security.conf;

    location = /up {
        try_files $uri /backend.php?$query_string;
    }

    location ~ ^/(auth|sanctum)(/|$) {
        limit_req zone=gaz_armory_auth burst=10 nodelay;
        try_files $uri /backend.php?$query_string;
    }

    location ~ ^/api(/|$) {
        limit_req zone=gaz_armory_api burst=60 nodelay;
        try_files $uri /backend.php?$query_string;
    }

    location /storage/ {
        alias /var/www/gaz-armory/current/backend/storage/app/public/;
        access_log off;
        expires 7d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/gaz-armory-security.conf;
    }

    # Laravel authenticates /api/media/{id}/file, then Nginx streams the file.
    # "internal" prevents users from bypassing the application permission check.
    location /protected-media/ {
        internal;
        alias /var/www/gaz-armory/current/backend/storage/app/private/media/;
        access_log off;
        add_header Cache-Control "private, max-age=86400";
        include /etc/nginx/snippets/gaz-armory-security.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell must always revalidate; JS/CSS filenames are content-hashed.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/gaz-armory-security.conf;
        try_files $uri =404;
    }

    location = /backend.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gaz-armory/current/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
